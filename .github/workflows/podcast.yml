name: Monitorar e publicar podcast

on:
  schedule:
    - cron: "17 10 * * *"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:
    inputs:
      publish_video_id:
        description: "ID do vídeo marcado como pronto (deixe vazio para só verificar)"
        required: false
        type: string
      start_time:
        description: "Início do corte (ex: 00:35:00) - opcional se o vídeo já estiver editado"
        required: false
        type: string
      end_time:
        description: "Fim do corte (ex: 01:25:00) - opcional se o vídeo já estiver editado"
        required: false
        type: string

concurrency:
  group: podcast-feed
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      feed_ready: ${{ steps.feed.outputs.ready }}
    env:
      YOUTUBE_SOURCE_URL: https://www.youtube.com/@nucleodafelive/streams
      YOUTUBE_CHANNEL_ID: UC7TCRwfLKSwDLErV1Zrq-_A
      PODCAST_TITLE: Núcleo da Fé
      PODCAST_AUTHOR: Núcleo da Fé
      PODCAST_SITE_URL: https://www.youtube.com/@nucleodafelive
      PODCAST_EMAIL: ${{ vars.PODCAST_EMAIL }}
      PODCAST_IMAGE_URL: ${{ vars.PODCAST_IMAGE_URL }}
      PODCAST_FEED_URL: ${{ vars.PODCAST_FEED_URL }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      R2_PUBLIC_DOMAIN: ${{ vars.R2_PUBLIC_DOMAIN }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Obter arquivos do repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Verificar transmissões concluídas
        id: scan
        run: python scan_videos.py

      - name: Guardar durações observadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar durações das transmissões"
            git push
          fi

      - name: Criar issues para pregações prontas
        if: steps.scan.outputs.ready_ids != ''
        env:
          GH_TOKEN: ${{ github.token }}
          READY_IDS: ${{ steps.scan.outputs.ready_ids }}
        run: |
          IFS=',' read -r -a ids <<< "$READY_IDS"
          for id in "${ids[@]}"; do
            if gh issue list --state all --limit 200 --json title --jq '.[].title' | grep -Fxq "[Podcast pronto] $id"; then
              continue
            fi
            body_file="$(mktemp)"
            printf '%s\n' \
              "O vídeo https://www.youtube.com/watch?v=$id está com duração de pregação e pronto para revisão." \
              "" \
              "Confira no YouTube se restou apenas a pregação. Para publicar, execute o workflow 'Monitorar e publicar podcast' com publish_video_id=$id." \
              "" \
              "Dica: Caso o vídeo ainda precise de corte de início e fim, você também pode preencher start_time e end_time no workflow." \
              > "$body_file"
            gh issue create --title "[Podcast pronto] $id" --body-file "$body_file"
            rm -f "$body_file"
          done

      - name: Instalar FFmpeg
        if: inputs.publish_video_id != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Publicar vídeo aprovado
        if: inputs.publish_video_id != ''
        env:
          VIDEO_ID: ${{ inputs.publish_video_id }}
          START_TIME: ${{ inputs.start_time }}
          END_TIME: ${{ inputs.end_time }}
        run: |
          cmd=(python processar_podcast.py --video-id "$VIDEO_ID")
          if [ -n "$START_TIME" ] && [ -n "$END_TIME" ]; then
            cmd+=(--start "$START_TIME" --end "$END_TIME")
          fi
          "${cmd[@]}"
          python scan_videos.py
          git add podcast.xml video_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Publicar episódio $VIDEO_ID"
            git push
          fi

      - name: Fechar issue do episódio publicado
        if: inputs.publish_video_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VIDEO_ID: ${{ inputs.publish_video_id }}
        run: |
          issue="$(gh issue list --state open --search "$VIDEO_ID in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Episódio publicado no feed do podcast."
          fi

      - name: Preparar feed para GitHub Pages
        id: feed
        run: |
          if [ -s podcast.xml ]; then
            mkdir -p public
            cp podcast.xml public/podcast.xml
            cp index.html public/index.html
            touch public/.nojekyll
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enviar artefato do feed
        if: steps.feed.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: needs.process.outputs.feed_ready == 'true'
    needs: process
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
